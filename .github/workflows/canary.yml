name: Hyprland main

# a schedule runs from the default branch, so this file sits on both and always tests the canary branch
on:
  push:
    branches: [canary]
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  # unpinned hyprland main builds here, so this job holds no token that can write
  hyprland-main:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: canary
          path: fluency
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            extra-substituters = https://hyprland.cachix.org
            extra-trusted-public-keys = hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc=
      - name: plugins and config against hyprland main
        env:
          CANARY_BADGE: ${{ github.workspace }}/canary.json
        run: |
          timeout 4800 nix develop ./fluency/ci/canary --no-write-lock-file -c fluency/ci/canary.sh fluency 2>&1 | tee canary.log
          exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: canary
          path: |
            canary.log
            canary.json
          if-no-files-found: ignore
          retention-days: 14

  # writes the badge and the issue from the files the build left, it runs none of their code
  publish:
    needs: hyprland-main
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: canary
        continue-on-error: true
      # the readme badge reads this file, one commit on a branch of its own replaced each run
      - name: badge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f canary.json ] || { echo "[badge] result=skipped reason=no_badge_file"; exit 0; }
          mkdir badge && mv canary.json badge/ && cd badge
          git init -q -b badges && git add canary.json
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "Badge of the last canary run"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" badges
          echo "[badge] result=ok $(cat canary.json)"
      - name: report
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ needs.hyprland-main.result }}
        run: |
          open=$(gh issue list -R "${{ github.repository }}" --state open --search '"canary failed" in:title' --json number --jq '.[0].number // empty')
          if [ "$BUILD" = success ]; then
            [ -z "$open" ] || gh issue close "$open" -R "${{ github.repository }}" --comment "Green again on $(date +%F)."
            exit 0
          fi
          body=$(grep -E '^\[canary\]|error:' canary.log 2>/dev/null | head -40)
          if [ -n "$open" ]; then gh issue comment "$open" -R "${{ github.repository }}" --body "${body:-the build left no log, result $BUILD}"
          else gh issue create -R "${{ github.repository }}" --title "canary failed on hyprland main $(date +%F)" --body "${body:-the build left no log, result $BUILD}"; fi
